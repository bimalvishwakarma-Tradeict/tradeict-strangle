<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>chart_app — Delta BTCUSD</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: Segoe UI, sans-serif; background: #0e1117; color: #d8dee9; }
    #layout { display: grid; grid-template-columns: 42px 1fr 300px; grid-template-rows: 48px 1fr 132px 28px; height: 100%; }
    header { grid-column: 1 / 4; display: flex; align-items: center; flex-wrap: nowrap; gap: 8px 12px; padding: 0 12px; background: #161b22; border-bottom: 1px solid #30363d; overflow-x: auto; }
    #drawBar {
      grid-column: 1; grid-row: 2 / 4; display: flex; flex-direction: column; gap: 4px;
      padding: 6px 4px; background: #161b22; border-right: 1px solid #30363d; overflow-y: auto;
    }
    #drawBar button { width: 32px; height: 28px; padding: 0; font-size: 13px; line-height: 1; }
    #drawBar hr { border: 0; border-top: 1px solid #30363d; margin: 4px 0; }
    #drawMenu {
      position: fixed; z-index: 50; background: #161b22; border: 1px solid #30363d;
      border-radius: 6px; padding: 8px; min-width: 160px; font-size: 12px;
    }
    #drawMenu button { margin: 2px 2px; }
    #drawMenu .swatch { width: 18px; height: 18px; border-radius: 3px; padding: 0; border: 1px solid #30363d; }
    #drawTextInput {
      position: fixed; z-index: 51; width: 180px; background: #21262d; color: #e6edf3;
      border: 1px solid #58a6ff; border-radius: 4px; padding: 4px 8px;
    }
    #alertBanner {
      display: none; position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
      z-index: 40; padding: 10px 18px; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-weight: 600; color: #fff; box-shadow: 0 4px 16px #0008; max-width: 80%;
    }
    #alertBanner.show { display: block; }
    #alertBanner.long { background: #238636; }
    #alertBanner.short { background: #da3633; }
    #alertLog { list-style: none; margin: 0; padding: 0; }
    #alertLog li { padding: 6px 4px; border-bottom: 1px solid #21262d; }
    #alertLog .long { color: #3fb950; }
    #alertLog .short { color: #f85149; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    select, input, button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
    button { cursor: pointer; }
    button:hover { background: #30363d; }
    button.active { background: #388bfd; border-color: #388bfd; color: #fff; }
    button:disabled { opacity: 0.45; cursor: default; }
    #replayStats { list-style: none; margin: 0; padding: 0; }
    #replayStats li { padding: 6px 4px; border-bottom: 1px solid #21262d; }
    #replayStats .long { color: #3fb950; }
    #replayStats .short { color: #f85149; }
    #replayStats .pending { color: #8b949e; }
    #chart { grid-column: 2; grid-row: 2; min-width: 0; }
    #rsiChart { grid-column: 2; grid-row: 3; min-width: 0; border-top: 1px solid #30363d; }
    #rsiChart.hidden { display: none; }
    aside { grid-column: 3; grid-row: 2 / 4; border-left: 1px solid #30363d; background: #161b22; overflow: auto; padding: 10px; font-size: 12px; }
    aside h2 { font-size: 12px; margin: 12px 0 6px; color: #8b949e; text-transform: uppercase; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
    label { display: flex; align-items: center; gap: 4px; }
    #trades { list-style: none; margin: 0; padding: 0; }
    #trades li { padding: 6px 4px; border-bottom: 1px solid #21262d; cursor: pointer; }
    #trades li:hover { background: #21262d; }
    #trades .long { color: #3fb950; }
    #trades .short { color: #f85149; }
    footer { grid-column: 1 / 4; display: flex; align-items: center; gap: 16px; padding: 0 12px; font-size: 12px; background: #161b22; border-top: 1px solid #30363d; }
    #dot { width: 8px; height: 8px; border-radius: 50%; background: #8b949e; }
    #dot.live { background: #3fb950; }
    #dot.reconnecting { background: #d29922; }
    .ohlc span { margin-right: 10px; }
  </style>
</head>
<body>
  <div id="layout">
    <header>
      <h1>BTCUSD · Delta India</h1>
      <label>TF
        <select id="tf">
          <option value="1m" selected>1m</option>
          <option value="3m">3m</option>
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="1h">1h</option>
          <option value="4h">4h</option>
        </select>
      </label>
      <label>Jump IST
        <input id="jump" type="datetime-local" />
      </label>
      <button id="btnJump">Go</button>
      <button id="btnLive" type="button">Live</button>
      <button id="btnSelectBar" type="button">Select bar</button>
      <button id="btnReplayPlay" type="button" disabled>Play</button>
      <button id="btnReplayStep" type="button" disabled>Step</button>
      <button id="btnReplayFollow" type="button" disabled>Follow</button>
      <label>Speed
        <select id="replaySpeed">
          <option value="1" selected>1x</option>
          <option value="3">3x</option>
          <option value="10">10x</option>
        </select>
      </label>
      <button id="btnReplayLive" type="button">Jump to real-time</button>
      <button id="btnAlerts" type="button">🔔 Alerts</button>
      <label><input type="checkbox" id="togAlertSkipped" /> Skipped signals pe bhi alert</label>
      <button id="btnTestAlert" type="button">Test alert</button>
      <span id="statusLabel">connecting</span>
      <span id="histStatus">Candles: 0 | idle</span>
    </header>
    <div id="drawBar">
      <button type="button" data-tool="cursor" title="Cursor">↖</button>
      <button type="button" data-tool="hline" title="Horizontal line">─</button>
      <button type="button" data-tool="hray" title="Horizontal ray">→</button>
      <button type="button" data-tool="trend" title="Trend line">╱</button>
      <button type="button" data-tool="vline" title="Vertical line">│</button>
      <button type="button" data-tool="rect" title="Rectangle">▭</button>
      <button type="button" data-tool="text" title="Text note">T</button>
      <button type="button" data-tool="long" title="Long position">L▲</button>
      <button type="button" data-tool="short" title="Short position">S▼</button>
      <hr />
      <button type="button" id="drawMagnet" title="Magnet OHLC">M</button>
      <button type="button" id="drawHide" title="Hide all">H</button>
      <button type="button" id="drawDeleteAll" title="Delete all">✕</button>
    </div>
    <div id="chart"></div>
    <div id="rsiChart"></div>
    <aside>
      <h2>Strategy</h2>
      <div class="row">
        <label>Signal
          <select id="strategy">
            <option value="S020" selected>VWAP Signal</option>
            <option value="S020_RSI">RSI Div Signal</option>
          </select>
        </label>
      </div>
      <h2>S020 VWAP Swing</h2>
      <div class="row">
        <label>Line TF
          <select id="lineTf">
            <option value="1m" selected>1m</option>
            <option value="3m">3m</option>
            <option value="5m">5m</option>
            <option value="15m">15m</option>
          </select>
        </label>
        <label>Variant
          <select id="variant">
            <option value="V0" selected>V0 touch</option>
            <option value="V3">V3 sweep-reclaim</option>
          </select>
        </label>
        <label>Last hours
          <input id="hours" type="number" value="24" min="1" max="168" style="width:56px" />
        </label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="togVwap" checked /> VWAP</label>
        <label><input type="checkbox" id="togActive" checked /> Active lines</label>
        <label><input type="checkbox" id="togExpired" checked /> Expired lines</label>
        <label><input type="checkbox" id="togMarks" checked /> Markers</label>
        <label>Marker mode
          <select id="markerMode">
            <option value="raw">Raw touches</option>
            <option value="backtest">Backtest entries</option>
          </select>
        </label>
      </div>
      <button id="btnOverlay">Reload overlay</button>
      <h2>RSI Div</h2>
      <div class="row">
        <label>Signal TF
          <select id="signalTf">
            <option value="1m">1m</option>
            <option value="3m">3m</option>
            <option value="5m">5m</option>
            <option value="15m" selected>15m</option>
            <option value="30m">30m</option>
          </select>
        </label>
        <label>RSI Length <input id="rsiLen" type="number" value="14" min="2" max="50" style="width:48px" /></label>
        <label>OB <input id="rsiOb" type="number" value="70" min="50" max="90" style="width:48px" /></label>
        <label>OS <input id="rsiOs" type="number" value="30" min="10" max="50" style="width:48px" /></label>
        <label>OBH expire RSI <input id="rsiExpObh" type="number" value="40" min="10" max="70" style="width:48px" /></label>
        <label>OBL expire RSI <input id="rsiExpObl" type="number" value="60" min="30" max="90" style="width:48px" /></label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="togObh" checked /> Show OBH</label>
        <label><input type="checkbox" id="togObl" checked /> Show OBL</label>
        <label><input type="checkbox" id="togLevels" checked /> Show OBH/OBL Levels</label>
        <label><input type="checkbox" id="togSigs" checked /> Show Signals</label>
        <label><input type="checkbox" id="togRsiPane" checked /> RSI pane (70/30)</label>
      </div>
      <h2>Alerts</h2>
      <ul id="alertLog"></ul>
      <h2>Replay stats</h2>
      <div id="replayCursorLab" class="row">off</div>
      <ul id="replayStats"></ul>
      <h2>Backtest trades</h2>
      <select id="tradeFile" style="width:100%"></select>
      <button id="btnTrades">Load trades</button>
      <ul id="trades"></ul>
    </aside>
    <footer>
      <div id="dot"></div>
      <div class="ohlc" id="ohlc">OHLC —</div>
      <div id="markTip"></div>
    </footer>
  </div>
  <div id="alertBanner"></div>
  <div id="drawMenu" hidden>
    <div>Color</div>
    <button type="button" class="swatch" data-color="#58a6ff" style="background:#58a6ff"></button>
    <button type="button" class="swatch" data-color="#3fb950" style="background:#3fb950"></button>
    <button type="button" class="swatch" data-color="#f85149" style="background:#f85149"></button>
    <button type="button" class="swatch" data-color="#d29922" style="background:#d29922"></button>
    <button type="button" class="swatch" data-color="#d2a8ff" style="background:#d2a8ff"></button>
    <div>Width</div>
    <button type="button" data-width="1">1</button>
    <button type="button" data-width="2">2</button>
    <button type="button" data-width="3">3</button>
    <div>Style</div>
    <button type="button" data-style="solid">Solid</button>
    <button type="button" data-style="dashed">Dashed</button>
    <div>
      <button type="button" data-act="lock">Lock</button>
      <button type="button" data-act="delete">Delete</button>
    </div>
  </div>
  <input id="drawTextInput" hidden placeholder="Note…" />
  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="/static/drawings.js?v=draw1"></script>
  <script src="/static/app.js?v=draw1"></script>
</body>
</html>
